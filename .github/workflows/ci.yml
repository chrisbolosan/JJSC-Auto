name: CI pipeline deployment

#https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
on:
  pull_request:
  push:
    branches:
      - main
      - develop
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      #https://github.com/actions/checkout
      - name: Acquire the code
        uses: actions/checkout@v4

      #https://github.com/actions/setup-node
      - name: Set node version
        uses: actions/setup-node@v4
        with:
          #nvmrc node 22 set
          node-version: '22'
          # 3 packages per our repo
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install root package
        run: npm ci

      - name: Install api package
        run: npm ci --prefix api

      - name: Install web package
        run: npm ci --prefix web

      - name: Typecheck api
        run: npm run typecheck --prefix api

      - name: Linter
        run: npm run lint --prefix web

      - name: Build web front
        run: npm run build --prefix web
